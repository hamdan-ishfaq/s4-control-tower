name: build

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch: {}

permissions: { contents: read }

env:
  PYTHONUTF8: "1"

jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, config: pipeline/config.yaml }
          - { os: windows-latest, config: pipeline/config.small.yaml }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version-file: .python-version, cache: pip, cache-dependency-path: requirements.lock }
      - uses: actions/cache@v4
        with:
          path: data/m5
          key: m5-${{ runner.os }}-v1
      - run: pip install -r requirements.lock
      - run: python tasks.py data --config ${{ matrix.config }}
      - run: pytest -q
